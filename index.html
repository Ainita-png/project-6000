</style></head><body>
<div class="h"><small style="color:#0f0">● ARCHITECT 6000</small><h2>AiNiTA BUNKER</h2><small>"Zapamti ovo, zaboravi sve / Ne sklanjam se..."</small></div>
<a href="tel:019547124" class="p">🚨 HITNA POMOĆ: 019 547 124</a>

const K = [
