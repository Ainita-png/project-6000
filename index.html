<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIRUČNIK ZA NEGAVATELJE</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .header { background: #1a4a8e; color: white; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: 20px auto; padding: 15px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #log-area { height: 300px; border: 1px solid #ddd; overflow-y: auto; padding: 10px; margin-bottom: 20px; font-size: 0.9em; background: #fff; }
        .log-entry { padding: 8px; border-bottom: 1px solid #eee; }
        .log-entry.alert { background: #ffebee; color: #c62828; font-weight: bold; border-left: 5px solid #c62828; }
        select, input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .btn-main { background: #1a4a8e; color: white; font-weight: bold; cursor: pointer; border: none; }
        .btn-emergency { background: #e53935; color: white; font-weight: bold; cursor: pointer; border: none; margin-top: 10px; }
        #the-alert { display: none; padding: 15px; background: #fff3e0; border: 2px solid #ff9800; margin-bottom: 10px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="header">
    <h2>PRIRUČNIK ZA NEGAVATELJE</h2>
    <p>DOM LELA I FRANC - 019/547-124</p>
</div>

<div class="container">
    <div id="log-area">Učitavam podatke iz baze...</div>

    <div id="the-alert"></div>

    <select id="nurse-name">
        <option value="">Izaberite ime negovatelja</option>
        <option value="Igor">Igor</option>
        <option value="Supruga">Supruga</option>
    </select>

    <input type="text" id="patient-input" placeholder="Simptom (mučnina, pritisak, bol)...">

    <button class="btn-main" onclick="izvršiProtokol()">EVIDENTIRAJ PROMENU</button>
    <button class="btn-emergency" onclick="registrujHitnu()">🚑 HITNA POMOĆ</button>
</div>

<script>
    // 1. Tvoji Firebase ključevi (Provereni)
    const firebaseConfig = {
        apiKey: "AIzaSyCU88D_CfthHl5V3y_tb4zTD5LDuQgtpdo",
        authDomain: "dom-lela-franc.firebaseapp.com",
        databaseURL: "https://dom-lela-franc-default-rtdb.firebaseio.com",
        projectId: "dom-lela-franc",
        storageBucket: "dom-lela-franc.firebasestorage.app",
        messagingSenderId: "738374234809",
        appId: "1:738374234809:web:6824602f58dc20b6a0e168",
        measurementId: "G-B2Q08B0MMV"
    };

    // 2. Inicijalizacija
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const logsRef = db.ref('dnevnik');

    // 3. Medicinski protokoli
    const protokoli = {
        "muč": "Administrirati KLOMETOL. Pratiti stanje.",
        "dija": "2x KLOMETOL + 1 caps PROBIOTIK.",
        "bol": "HITNO: Pozvati dežurnog lekara!"
    };

    // 4. Čitanje u realnom vremenu
    logsRef.on('value', (snapshot) => {
        const data = snapshot.val();
        const logArea = document.getElementById('log-area');
        logArea.innerHTML = "";
        if (data) {
            Object.values(data).reverse().forEach(log => {
                const div = document.createElement('div');
                div.className = log.hitno ? 'log-entry alert' : 'log-entry';
                div.innerHTML = `<strong>[${log.vreme}] ${log.ko}:</strong> ${log.tekst}`;
                logArea.appendChild(div);
            });
        } else {
            logArea.innerHTML = "Dnevnik je prazan.";
        }
    });

    // 5. Glavna funkcija
    window.izvršiProtokol = function() {
        const ko = document.getElementById('nurse-name').value;
        const unos = document.getElementById('patient-input').value;
        const alertBox = document.getElementById('the-alert');

        if (!ko) { alert("Izaberi svoje ime!"); return; }
        if (!unos) return;

        let instrukcija = "Zabeleženo u dnevnik rada.";
        let hitno = false;

        // Provera visokog pritiska
        const pritisakMatch = unos.match(/(\d+)\/(\d+)/);
        if (pritisakMatch && parseInt(pritisakMatch[1]) > 170) {
            instrukcija = "ALARM: Pritisak je VISOK! Odmor i provera za 15 min.";
            hitno = true;
        } else {
            for (let k in protokoli) {
                if (unos.toLowerCase().includes(k)) {
                    instrukcija = "INSTRUKCIJA: " + protokoli[k];
                    hitno = true;
                }
            }
        }

        alertBox.style.display = "block";
        alertBox.innerHTML = instrukcija;

        logsRef.push({
            vreme: new Date().toLocaleTimeString('sr-RS'),
            ko: ko,
            tekst: unos.toUpperCase() + " -> " + instrukcija,
            hitno: hitno
        });

        document.getElementById('patient-input').value = "";
    };

    // 6. Hitna pomoć poziv
    window.registrujHitnu = function() {
        const ko = document.getElementById('nurse-name').value || "NEPOZNATO";
        logsRef.push({
            vreme: new Date().toLocaleTimeString('sr-RS'),
            ko: ko,
            tekst: "!!! POKRENUT POZIV HITNOJ SLUŽBI !!!",
            hitno: true
        });
        window.location.href = "tel:019547124";
    };
</script>

</body>
</html>
