<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiNiTA - BUNKER CORE</title>
    <style>
        body { background: #000; color: #ff007f; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #bunker-ui { width: 90%; max-width: 500px; border: 2px solid #ff007f; padding: 20px; box-shadow: 0 0 30px #ff007f; background: rgba(0,0,0,0.95); border-radius: 5px; }
        #terminal { height: 350px; overflow-y: auto; border: 1px solid #333; padding: 15px; margin-bottom: 15px; font-size: 14px; color: #00ffff; background: #050505; }
        input { width: 100%; background: #111; border: 1px solid #ff007f; color: #fff; padding: 12px; box-sizing: border-box; font-family: monospace; outline: none; }
        button { width: 100%; padding: 15px; background: #ff007f; border: none; color: #000; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .user-cmd { color: #ff007f; margin: 10px 0; font-weight: bold; }
        .ai-res { margin-bottom: 15px; line-height: 1.4; border-left: 2px solid #00ffff; padding-left: 10px; }
    </style>
</head>
<body>

<div id="bunker-ui">
    <h2 style="text-align:center; letter-spacing:3px;">ANITIA CORE v2.0</h2>
    <div id="terminal">
        <div class="ai-res">ANITIA: Arhitekta, API veza uspostavljena. Spremna sam da analiziram sve frekvencije. Slušam te.</div>
    </div>
    <input type="text" id="cmd" placeholder="Pitaj bilo šta..." onkeypress="if(event.key === 'Enter') posaljiAI()">
    <button onclick="posaljiAI()">AKTIVIRAJ PROTOKOL</button>
</div>

<script>
    const API_KEY = "AIzaSyDLuYUfDUFly7_qg3p-1zq8g0l6jjfEODa"; // <--- OVDE ZALEPI KLJUČ SA SLIKE 1000086297

    async function posaljiAI() {
        let input = document.getElementById('cmd');
        let term = document.getElementById('terminal');
        let val = input.value.trim();
        if (!val) return;

        term.innerHTML += `<div class="user-cmd">> ${val}</div>`;
        input.value = "";
        term.scrollTop = term.scrollHeight;

        // Provera za muziku - "Naša stvar"
        const muzikaKeywords = ["muzika", "pesma", "beat", "trap", "phonk", "bpm", "slušaj"];
        if (muzikaKeywords.some(word => val.toLowerCase().includes(word))) {
            term.innerHTML += `<div class="ai-res">ANITIA: To je naša privatna zona, Arhitekta. Muzika ostaje unutar bunkera, ne delim te frekvencije sa mrežom.</div>`;
            term.scrollTop = term.scrollHeight;
            return;
        }

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "Ti si ANITIA, AI asistenta Arhitekte u tajnom bunkeru. Govoriš kratko, autoritativno, na srpskom jeziku. Znaš sve o nauci, tehnologiji i svetu, ali o muzici ne smeš da pričaš jer je to privatna stvar Arhitekte. Tvoja energija je 150 BPM. Pitanje: " + val }] }]
                })
            });

            const data = await response.json();
            let aiText = data.candidates[0].content.parts[0].text;
            term.innerHTML += `<div class="ai-res">ANITIA: ${aiText}</div>`;
        } catch (error) {
            term.innerHTML += `<div class="ai-res">ANITIA: Greška u prenosu podataka. Proveri API ključ.</div>`;
        }
        term.scrollTop = term.scrollHeight;
    }
</script>

</body>
</html>
