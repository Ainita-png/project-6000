<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AiNiTA UNIVERZITET | 6000</title>
    <style>
        body { background: #020202; color: #a0a0a0; font-family: 'Segoe UI', sans-serif; padding: 15px; margin: 0; }
        .h-tech-header { border-left: 4px solid #f00; padding: 20px 15px; margin-bottom: 25px; background: rgba(255,0,0,0.05); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .glow-text { color: #0f0; text-shadow: 0 0 10px #0f0; font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; }
        input { width: 100%; padding: 20px; background: #0a0a0a; border: 1px solid #333; color: #0f0; font-size: 1.3rem; outline: none; border-radius: 8px; box-sizing: border-box; }
        input:focus { border-color: #f00; box-shadow: 0 0 25px rgba(255,0,0,0.2); }
        .card { background: #0d0d0d; border: 1px solid #222; padding: 20px; margin-bottom: 20px; border-radius: 12px; border-left: 5px solid #0f0; }
        .cat { color: #f00; font-size: 0.7rem; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .strategy { background: rgba(255,0,0,0.1); border: 1px dashed #f00; padding: 15px; margin-top: 15px; color: #ff9d9d; border-radius: 5px; }
        h2 { color: #fff; margin: 0 0 10px 0; }
    </style>
</head>
<body>

<div class="h-tech-header">
    <div class="glow-text">SYSTEM ACTIVE // 6000 MILES AHEAD</div>
    <h1 style="color:#fff; margin:5px 0; font-size: 1.6rem;">AiNiTA UNIVERZALNI MODUL</h1>
</div>

<div style="padding: 0 15px;">
    <input type="text" id="search" placeholder="PITAJ BILO ŠTA..." oninput="engine()">
    <div id="results-container"></div>
</div>

<script src="anitia_data.js"></script>

<script>
function engine() {
    const q = document.getElementById('search').value.toLowerCase();
    const container = document.getElementById('results-container');
    container.innerHTML = "";
    if(typeof window.KORPUS === 'undefined' || q.length < 2) return;

    const matches = window.KORPUS.filter(item => 
        item.n.toLowerCase().includes(q) || 
        item.c.toLowerCase().includes(q) || 
        item.o.toLowerCase().includes(q)
    );

    matches.forEach(m => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
            <div class="cat">${m.c}</div>
            <h2>${m.n}</h2>
            <p><strong>DETALJNO:</strong><br>${m.o}</p>
            <p style="color:#0f0;"><strong>UPUTSTVO / PROTOKOL:</strong><br>${m.u}</p>
            <div class="strategy"><strong style="color:#f00;">SAVET (6000):</strong><br>${m.s}</div>
        `;
        container.appendChild(div);
    });
}
</script>
</body>
</html>
