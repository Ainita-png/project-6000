<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AiNiTA | 6000</title>
    <style>
        body { background: #020202; color: #a0a0a0; font-family: 'Courier New', monospace; padding: 15px; margin: 0; }
        .header { border-left: 5px solid #f00; padding: 20px; margin-bottom: 20px; background: rgba(255,0,0,0.05); }
        .status { color: #0f0; text-shadow: 0 0 10px #0f0; font-size: 0.75rem; letter-spacing: 2px; }
        input { width: 100%; padding: 22px; background: #080808; border: 1px solid #333; color: #0f0; font-size: 1.4rem; outline: none; border-radius: 4px; box-sizing: border-box; border-bottom: 3px solid #f00; }
        #results { margin-top: 25px; }
        .card { background: #0a0a0a; border: 1px solid #222; padding: 20px; margin-bottom: 20px; border-left: 6px solid #0f0; border-radius: 2px; }
        .tag { color: #f00; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; display: block; }
        .protocol { background: rgba(255,0,0,0.1); border: 1px dashed #f00; padding: 15px; margin-top: 15px; color: #ff9d9d; }
        h2 { color: #fff; margin: 0 0 10px 0; font-size: 1.5rem; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="header">
    <div class="status">SYSTEM ONLINE // ARCHITECT MODE ACTIVE</div>
    <h1 style="color:#fff; margin:5px 0;">AiNiTA UNIVERZITET</h1>
</div>

<input type="text" id="search" placeholder="UNESI POJAM (PRITISAK, BRO, PSIHO)..." oninput="runEngine()">

<div id="results"></div>

<script>
// --- INTEGRISANA UNIVERZALNA BAZA ---
const KORPUS = [
    {
        n: "Visok Krvni Pritisak (Hipertenzija)",
        c: "Kardiologija / Hitno",
        o: "Pritisak iznad 180/110 mmHg. Opasnost od moždanog udara.",
        u: "Mirovanje, polusedeći položaj, merenje na 15 minuta.",
        s: "Smiri pacijenta hladnim stavom. Tvoj mir sprečava skok adrenalina."
    },
    {
        n: "Bromazepam",
        c: "Farmakologija / Sedativ",
        o: "Anksiolitik za smirenje napetosti i straha.",
        u: "Prati nivo svesti. Rizik od pada kod starijih je ogroman.",
        s: "Ako je korisnik previše pospan, stopiraj dozu. Bezbednost pre svega."
    },
    {
        n: "Mračna Psihologija - Tišina",
        c: "Strategija / Psihologija",
        o: "Korišćenje tišine kao alata za pritisak na sagovornika.",
        u: "Nakon pitanja, ćuti i gledaj u oči. Ljudi će reći više nego što planiraju.",
        s: "Ti si Arhitekta. Kontroliši tok razgovora tako što vladaš tišinom."
    },
    {
        n: "Aikido - Stabilnost (Hara)",
        c: "Borilačke / Biomehanika",
        o: "Kontrola centra ravnoteže u donjem delu stomaka.",
        u: "Kod tvojih 97kg, niska tačka oslonca te čini neoborivim.",
        s: "Prilikom okretanja pacijenta, savij kolena i rotiraj iz kuka, ne iz leđa."
    },
    {
        n: "Aspiraciona Pneumonija",
        c: "Gerontologija / Nega",
        o: "Upala pluća zbog hrane u disajnim putevima.",
        u: "Uzglavlje na 90 stepeni tokom i 30 min nakon jela.",
        s: "Krkljanje nakon obroka je alarm. Odmah uspravi pacijenta."
    }
];

function runEngine() {
    const query = document.getElementById('search').value.toLowerCase();
    const output = document.getElementById('results');
    output.innerHTML = "";
    
    if(query.length < 2) return;

    const matches = KORPUS.filter(i => 
        i.n.toLowerCase().includes(query) || 
        i.c.toLowerCase().includes(query) || 
        i.o.toLowerCase().includes(query)
    );

    matches.forEach(m => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
            <span class="tag">${m.c}</span>
            <h2>${m.n}</h2>
            <p><strong>OPIS:</strong> ${m.o}</p>
            <p style="color:#0f0;"><strong>UPUTSTVO:</strong> ${m.u}</p>
            <div class="protocol">
                <strong style="color:#f00;">SAVET (6000):</strong><br>${m.s}
            </div>
        `;
        output.appendChild(div);
    });
}
</script>
</body>
</html>
