<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AiNiTA | 6000</title>
    <style>
        body { background: #020202; color: #a0a0a0; font-family: 'Courier New', monospace; padding: 15px; margin: 0; }
        .header { border-left: 5px solid #f00; padding: 20px; margin-bottom: 20px; background: rgba(255,0,0,0.05); }
        .status { color: #0f0; text-shadow: 0 0 10px #0f0; font-size: 0.75rem; letter-spacing: 2px; }
        input { width: 100%; padding: 22px; background: #080808; border: 1px solid #333; color: #0f0; font-size: 1.4rem; outline: none; border-radius: 4px; box-sizing: border-box; border-bottom: 3px solid #f00; }
        #results { margin-top: 25px; }
        .card { background: #0a0a0a; border: 1px solid #222; padding: 20px; margin-bottom: 20px; border-left: 6px solid #0f0; border-radius: 2px; }
        .tag { color: #f00; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; display: block; }
        .protocol { background: rgba(255,0,0,0.1); border: 1px dashed #f00; padding: 15px; margin-top: 15px; color: #ff9d9d; }
        h2 { color: #fff; margin: 0 0 10px 0; font-size: 1.5rem; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="header">
    <div class="status">SYSTEM ONLINE // ARCHITECT MODE ACTIVE</div>
    <h1 style="color:#fff; margin:5px 0;">AiNiTA UNIVERZITET</h1>
</div>

<input type="text" id="search" placeholder="PITAJ (PRITISAK, BRO, PSIHO, HARA)..." oninput="runEngine()">

<div id="results"></div>

<script>
// --- TVOJA UNIVERZALNA BAZA (MESO) ---
const KORPUS = [
    {
        n: "Visok Krvni Pritisak (Hipertenzija)",
        c: "Kardiologija / Hitno",
        o: "Pritisak iznad 180/110 mmHg. Opasnost od moždanog udara i pucanja kapilara.",
        u: "Mirovanje u polusedećem položaju. Kontrola na 15 minuta. Ne davati vodu naglo.",
        s: "Šest hiljada koraka ispred: tvoj mir je ključ. Ako pacijent vidi da si ti stabilan, njegov adrenalin pada."
    },
    {
        n: "Nizak Krvni Pritisak (Hipotenzija)",
        c: "Kardiologija / Hitno",
        o: "Pad pritiska ispod 90/60 mmHg. Vrtoglavica, bledilo i rizik od kolapsa.",
        u: "Podizanje nogu iznad nivoa glave. Lagana hidratacija ako je svestan.",
        s: "Prati Lasix. Ako preteraju sa diureticima, ovo je direktna posledica."
    },
    {
        n: "Mračna Psihologija - Tišina",
        c: "Strategija / Psihologija",
        o: "Korišćenje tišine kao alata za pritisak na sagovornika u kriznim situacijama.",
        u: "Nakon pitanja, ćuti i gledaj u oči. Ljudi će reći više nego što planiraju jer im je tišina neprijatna.",
        s: "Arhitekta princip: Tišina je tvoj najjači pritisak. Pusti ih da sami popune prazninu informacijama."
    },
    {
        n: "Bromazepam",
        c: "Farmakologija / Sedativ",
        o: "Anksiolitik koji smanjuje napetost. Kod starijih izaziva jaku mišićnu relaksaciju.",
        u: "Prati stabilnost na nogama. Povećan rizik od preloma kuka pri ustajanju.",
        s: "Proveri nivo pospanosti pre davanja. Ako 'beči' oči ili tetura, javi lekaru."
    },
    {
        n: "Aikido - Stabilnost (Hara)",
        c: "Borilačke / Biomehanika",
        o: "Kontrola centra ravnoteže u donjem delu stomaka (Hara).",
        u: "Kod tvojih 97kg, niska tačka oslonca te čini neoborivim. Ne koristi samo ruke, koristi masu.",
        s: "Prilikom okretanja pacijenta, savij kolena i rotiraj iz kuka, ne iz leđa. Tvoja konstitucija je tvoja poluga."
    },
    {
        n: "Aspiraciona Pneumonija",
        c: "Gerontologija / Nega",
        o: "Upala pluća zbog upadanja hrane ili pljuvačke u disajne puteve.",
        u: "Pravilo 90 stepeni: pacijent mora biti uspravan tokom jela i 30 min nakon obroka.",
        s: "Ako čuješ krkljanje dok guta, odmah stopiraj. Preventiva je jedini lek koji radi 100%."
    }
];

function runEngine() {
    const query = document.getElementById('search').value.toLowerCase();
    const output = document.getElementById('results');
    output.innerHTML = "";
    
    if(query.length < 2) return;

    const matches = KORPUS.filter(i => 
        i.n.toLowerCase().includes(query) || 
        i.c.toLowerCase().includes(query) || 
        i.o.toLowerCase().includes(query)
    );

    matches.forEach(m => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
            <span class="tag">${m.c}</span>
            <h2>${m.n}</h2>
            <p><strong>OPIS:</strong> ${m.o}</p>
            <p style="color:#0f0;"><strong>PROTOKOL:</strong> ${m.u}</p>
            <div class="protocol">
                <strong style="color:#f00;">SAVET (6000):</strong><br>${m.s}
            </div>
        `;
        output.appendChild(div);
    });
}
</script>
</body>
</html>
