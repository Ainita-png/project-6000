<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIGITALNI IZVEŠTAJ - VIBER PRO v2</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    .header { background: #1a4a8e; color: white; text-align: center; padding: 20px; }
    .container { max-width: 500px; margin: 20px auto; padding: 15px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    #log-area { height: 300px; border: 1px solid #ddd; overflow-y: auto; padding: 10px; margin-bottom: 20px; font-size: 0.85em; background: #fff; text-align: left; }
    .log-entry { padding: 8px; border-bottom: 1px solid #eee; line-height: 1.4; }
    .log-entry.alert { background: #ffebee; color: #c62828; font-weight: bold; border-left: 5px solid #c62828; }
    input, button, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
    .btn-main { background: #1a4a8e; color: white; font-weight: bold; border: none; cursor: pointer; }
    .btn-viber { background: #7360f2; color: white; font-weight: bold; border: none; margin-top: 10px; cursor: pointer; }
    .btn-emergency { background: #e53935; color: white; font-weight: bold; border: none; margin-top: 10px; cursor: pointer; }
    .btn-clear { background: #333; color: white; font-size: 12px; opacity: 0.5; border: none; margin-top: 40px; cursor: pointer; }
    #the-alert { display: none; padding: 15px; background: #fff3e0; border: 2px solid #ff9800; margin-bottom: 10px; text-align: left; border-radius: 4px; }
    .tab-nav { display: flex; margin-bottom: 15px; }
    .tab-nav button { width: 50%; margin: 0; border-radius: 0; background: #ddd; color: #333; border: none; cursor: pointer; }
    .tab-nav button.active { background: #1a4a8e; color: white; }
    .tab { display: none; }
    .tab.active { display: block; }
    .footer { font-size:10px; color:#888; text-align:center; margin-top:30px; padding:15px 5px; border-top:1px solid #eee; }
    .dev-notice { background: #333; color: #0f0; font-family: monospace; font-size: 10px; padding: 5px; text-align: center; }
  </style>
</head>
<body>

  <div class="dev-notice">DEV MOD: v2 - Offline baza aktivna</div>

  <div class="header">
    <h2>DIGITALNI IZVEŠTAJ - VIBER</h2>
    <p>DOM LELA I FRANC - NEGOTIN</p>
  </div>

  <div class="container">
    <div class="tab-nav">
      <button id="tabDnevnikBtn" class="active">DNEVNIK</button>
      <button id="tabBazaBtn">BAZA ZNANJA</button>
    </div>

    <div id="tabDnevnik" class="tab active">
      <div id="log-area">Dnevnik je prazan.</div>
      <div id="the-alert"></div>
      
      <input type="text" id="nurse-name" placeholder="TVOJE IME (OBAVEZNO)...">
      <input type="text" id="patient-input" placeholder="Opiši simptom (npr. pritisak 180)...">
      
      <button class="btn-main" onclick="izvršiProtokol()">ZABELEŽI I DAJ UPUTSTVO</button>
      <button class="btn-viber" onclick="viberProtokol()">🟣 POŠALJI NA VIBER</button>
      <button class="btn-emergency" onclick="registrujHitnu()">🚑 HITNA POMOĆ</button>
      <button class="btn-clear" onclick="obrišiSve()">OBRIŠI KOMPLETAN DNEVNIK</button>

      <div class="footer">
        DOM LELA I FRANC - NEGOTIN © 2026
      </div>
    </div>

    <div id="tabBaza" class="tab">
      <p style="font-size: 12px; color: #666;">Ovde možete videti listu svih simptoma u sistemu.</p>
      <div id="lista-simptoma" style="max-height: 400px; overflow-y: auto; font-size: 13px;"></div>
    </div>
  </div>

  <script>
    let devLogovi = [];
    const devSimptomi = [
      {naziv: "Dijareja", prvaPomoc: "1. Popij odmah 2 kapsule Loperamida. 2. Pij dosta tečnosti.", upozorenje: "Ne ako imaš krv ili temp >38.", hitno: false},
      {naziv: "Mučnina", prvaPomoc: "1. Popij 1 tbl Klometola. 2. Sedi uspravno.", upozorenje: "Prijavi ako počne povraćanje.", hitno: false},
      {naziv: "Pritisak", prvaPomoc: "1. Katopil 25mg pod jezik (ako je 160-180). 2. Nifelat 10mg (ako je 180-200).", upozorenje: "Lezi 30 min nakon leka.", hitno: false},
      {naziv: "Pritisak hitno", prvaPomoc: "Prekini sve aktivnosti. Sedi ili lezi.", upozorenje: "PRITISAK PREKO 200 JE HITNO STANJE!", hitno: true},
      {naziv: "Bol u grudima", prvaPomoc: "Sedi ili lezi odmah. Ne uzimaj vodu.", upozorenje: "ODMAH ZOVI 194!", hitno: true},
      {naziv: "Temperatura", prvaPomoc: "Paracetamol 500mg (ako je >38.5).", upozorenje: "Ako je >39.5, zovi pomoć.", hitno: false}
    ];

    // Navigacija
    document.getElementById('tabDnevnikBtn').onclick = () => prebaciTab('tabDnevnik');
    document.getElementById('tabBazaBtn').onclick = () => {
      prebaciTab('tabBaza');
      prikaziBazu();
    };

    function prebaciTab(tabId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      document.getElementById(tabId + 'Btn').classList.add('active');
    }

    function prikaziBazu() {
      const lista = document.getElementById('lista-simptoma');
      lista.innerHTML = devSimptomi.map(s => `
        <div style="border-bottom: 1px solid #eee; padding: 10px;">
          <b>${s.naziv} ${s.hitno ? '🚨' : ''}</b><br>
          <small>${s.prvaPomoc}</small>
        </div>
      `).join('');
    }

    function izvršiProtokol() {
      const ko = document.getElementById('nurse-name').value;
      const unosRaw = document.getElementById('patient-input').value;
      const alertBox = document.getElementById('the-alert');
      
      if (!ko) { alert("Moraš se potpisati!"); return; }
      if (!unosRaw) return;

      const unos = unosRaw.toLowerCase();
      let pogodak = null;

      // Logika za brojeve
      const match = unos.match(/\d+/);
      const broj = match ? parseInt(match[0]) : null;

      if (unos.includes('pritisak') && broj) {
        if (broj > 200) pogodak = devSimptomi.find(s => s.naziv === 'Pritisak hitno');
        else if (broj >= 160) pogodak = devSimptomi.find(s => s.naziv === 'Pritisak');
      }

      // Logika za ključne reči
      if (!pogodak) {
        pogodak = devSimptomi.find(s => unos.includes(s.naziv.toLowerCase()));
      }

      if (pogodak) {
        alertBox.style.display = 'block';
        alertBox.style.borderColor = pogodak.hitno ? '#c62828' : '#ff9800';
        alertBox.innerHTML = `<b>${pogodak.naziv.toUpperCase()}</b><br>${pogodak.prvaPomoc}<br><br><i>${pogodak.upozorenje}</i>`;
      }

      // Dodaj u dnevnik
      const vreme = new Date().toLocaleTimeString('sr-RS', {hour: '2-digit', minute:'2-digit'});
      devLogovi.push({vreme, ko, tekst: unosRaw, hitno: pogodak ? pogodak.hitno : false});
      osvežiDnevnik();
    }

    function osvežiDnevnik() {
      const logArea = document.getElementById('log-area');
      logArea.innerHTML = devLogovi.slice().reverse().map(l => `
        <div class="log-entry ${l.hitno ? 'alert' : ''}">
          <b>[${l.vreme}] ${l.ko}:</b> ${l.tekst}
        </div>
      `).join('') || "Dnevnik je prazan.";
    }

    function viberProtokol() {
      if (devLogovi.length === 0) return;
      const zadnji = devLogovi[devLogovi.length - 1];
      const poruka = `IZVEŠTAJ (${zadnji.vreme}):\nSestra: ${zadnji.ko}\nSimptom: ${zadnji.tekst}`;
      window.location.href = "viber://forward?text=" + encodeURIComponent(poruka);
    }

    function registrujHitnu() {
      const ko = document.getElementById('nurse-name').value || "NEPOZNATO";
      devLogovi.push({vreme: "HITNO", ko, tekst: "🚑 AKTIVIRAN POZIV HITNOJ POMOĆI!", hitno: true});
      osvežiDnevnik();
      alert("POZIV REGISTROVAN! Odmah pozovite 194!");
    }

    function obrišiSve() {
      if(confirm("Brišeš ceo današnji dnevnik?")) {
        devLogovi = [];
        osvežiDnevnik();
        document.getElementById('the-alert').style.display = 'none';
      }
    }
  </script>
</body>
</html>
