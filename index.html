<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIRUČNIK ZA NEGOVATELJE</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .header { background: #1a4a8e; color: white; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: 20px auto; padding: 15px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #log-area { height: 350px; border: 1px solid #ddd; overflow-y: auto; padding: 10px; margin-bottom: 20px; font-size: 0.9em; background: #fff; text-align: left; }
        .log-entry { padding: 8px; border-bottom: 1px solid #eee; }
        .log-entry.alert { background: #ffebee; color: #c62828; font-weight: bold; border-left: 5px solid #c62828; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .btn-main { background: #1a4a8e; color: white; font-weight: bold; cursor: pointer; border: none; }
        .btn-emergency { background: #e53935; color: white; font-weight: bold; cursor: pointer; border: none; margin-top: 10px; }
        #the-alert { display: none; padding: 15px; background: #fff3e0; border: 2px solid #ff9800; margin-bottom: 10px; font-weight: bold; text-align: center; color: #333; }
    </style>
</head>
<body>

<div class="header">
    <h2>AiNiTA BUNKER - PROTOKOLI</h2>
    <p>DOM LELA I FRANC - NEGOTIN</p>
</div>

<div class="container">
    <div id="log-area">Učitavam dnevnik rada...</div>
    <div id="the-alert"></div>

    <input type="text" id="nurse-name" placeholder="TVOJE IME (OBAVEZNO)...">
    <input type="text" id="patient-input" placeholder="Opiši stanje (npr. visok pritisak, agresivan, dijareja...)">

    <button class="btn-main" onclick="izvršiProtokol()">ZABELEŽI PROMENU</button>
    <button class="btn-emergency" onclick="registrujHitnu()">🚑 HITNA POMOĆ</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCjty2cRQl6VRwal06EVX9VwEwxwhKbqkM",
        authDomain: "dom-lela-franc.firebaseapp.com",
        databaseURL: "https://dom-lela-franc-default-rtdb.firebaseio.com",
        projectId: "dom-lela-franc",
        storageBucket: "dom-lela-franc.firebasestorage.app",
        messagingSenderId: "738374234809",
        appId: "1:738374234809:web:6824602f58dc20b6a0e168"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const logsRef = db.ref('dnevnik');

    logsRef.limitToLast(20).on('value', (snapshot) => {
        const logArea = document.getElementById('log-area');
        logArea.innerHTML = "";
        const data = snapshot.val();
        if (data) {
            Object.values(data).reverse().forEach(log => {
                const div = document.createElement('div');
                div.className = log.hitno ? 'log-entry alert' : 'log-entry';
                const datumPrikaz = log.datum ? log.datum + " " : "";
                div.innerHTML = `<strong>[${datumPrikaz}${log.vreme}] ${log.ko}:</strong> ${log.tekst}`;
                logArea.appendChild(div);
            });
        } else {
            logArea.innerHTML = "Dnevnik je prazan.";
        }
    });

    window.izvršiProtokol = function() {
        const ko = document.getElementById('nurse-name').value;
        const unosRaw = document.getElementById('patient-input').value;
        const unos = unosRaw.toLowerCase();
        const alertBox = document.getElementById('the-alert');

        if (!ko || ko.trim().length < 2) { 
            alert("SISTEM: MORAŠ SE POTPISATI!"); 
            return; 
        }
        if (!unos) return;

        const odgovori = {
            // PRITISAK I HITNO
            'prit': 'IZMERI PRITISAK! Ako je gornji >170 -> NIFELAT (pod jezik) ili KATIOPIL. Zovi lekara!',
            'bol': 'GDE TAČNO BOLI? Grudi/stomak -> LEKAR! Glava/zglob -> ANALGIN ili IBUPROFEN.',
            'šeć': 'IZMERI ŠEĆER! Ako je <4 -> šećer i voda. Ako je >15 -> POZOVI LEKARA.',
            
            // STOMAK I LEKOVI
            'muč': 'KLOMETOL (1 tableta). Prati stanje pola sata.',
            'povr': 'STOP HRANI. Tečnost na kašičicu. KLOMETOL. Pozovi lekara!',
            'dija': 'LOPERAMID (1-2 kapsule). Dijetalna ishrana (pirinač, dvopek).',
            'želud': 'OMEPROL (1 ujutru na prazan stomak).',
            
            // TEMPERATURA I STANJA
            'temp': 'Ako je >38.5 -> IBUPROFEN ili ANALGIN. Ispod toga samo čaj i voda.',
            'drht': 'Izmeri temperaturu i šećer! Utopli korisnika. Ako ne prolazi -> LEKAR.',
            
            // PSIHIJATRIJA I PONAŠANJE
            'agres': 'SMIRI TON. Skloni opasne predmete. Ne protivreči. Pozovi pomoć.',
            'šizo': 'PROVERI TERAPIJU! Ako halucinira ili odbija lekove -> HITNO LEKAR.',
            'deme': 'Strpljenje. Kratke rečenice. Ne menjaj mu rutinu i prostor.',
            'ponaš': 'Proveri da li je mokar, gladan ili ga nešto boli. Budi miran.',

            // NEPOKRETNI KORISNICI
            'dekub': 'CRVENILO? Okretanje na svaka 2 sata! Cinkova mast. Antidekubitalni dušek.',
            'guše': 'ASPIRACIJA? Odmah podigni uzglavlje (sedeći položaj)! Pozovi lekara!',
            'opsti': 'Nema stolicu >3 dana? Čaj za probavu ili glicerinski čepić.',
            'rana': 'Čišćenje, previjanje. Javi lekaru ako se oseća miris ili ima gnoja.'
        };

        let instrukcija = "Zabeleženo u dnevnik. Prati stanje korisnika.";
        let hitno = false;

        const pMatch = unos.match(/(\d+)\/(\d+)/);
        if (pMatch && parseInt(pMatch[1]) > 170) {
            instrukcija = "!!! ALARM: KRITIČAN PRITISAK! DAJ NIFELAT I ZOVI LEKARA !!!";
            hitno = true;
        } else {
            for (let k in odgovori) {
                if (unos.includes(k)) {
                    instrukcija = "INSTRUKCIJA: " + odgovori[k];
                    hitno = true;
                    break;
                }
            }
        }

        alertBox.innerHTML = instrukcija;
        alertBox.style.display = "block";

        logsRef.push({
            datum: new Date().toLocaleDateString('sr-RS'),
            vreme: new Date().toLocaleTimeString('sr-RS'),
            ko: ko.toUpperCase(),
            tekst: unosRaw.toUpperCase() + " -> " + instrukcija,
            hitno: hitno
        });

        document.getElementById('patient-input').value = "";
    };

    window.registrujHitnu = function() {
        const ko = document.getElementById('nurse-name').value || "NEPOZNATO";
        logsRef.push({
            datum: new Date().toLocaleDateString('sr-RS'),
            vreme: new Date().toLocaleTimeString('sr-RS'),
            ko: ko.toUpperCase(),
            tekst: "!!! POKRENUT POZIV HITNOJ SLUŽBI !!!",
            hitno: true
        });
        window.location.href = "tel:019547124";
    };
</script>

</body>
</html>
