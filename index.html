.tab { display: none; }
.tab.active { display: block; }
.kartica { border: 1px solid #ddd; padding: 10px; margin: 8px 0; border-radius: 8px; background: #fafafa; }
.kartica b { color: #1a4a8e; }
label { font-size: 12px; font-weight: bold; color: #555; margin-top: 10px; display: block; }
.checkbox-wrap { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
.checkbox-wrap input { width: auto; }
.dev-notice { background: #ffeb3b; padding: 10px; text-align: center; font-weight: bold; }
