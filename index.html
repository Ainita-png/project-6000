<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiNiTA | Arhitekta 6000</title>
    <style>
        body { background: #050505; color: #d0d0d0; font-family: 'Courier New', monospace; padding: 15px; text-transform: uppercase; }
        .bunker-header { border-bottom: 3px solid #ff0000; padding-bottom: 15px; margin-bottom: 20px; }
        .status { color: #00ff00; font-size: 0.7rem; letter-spacing: 2px; margin-bottom: 5px; }
        input { width: 100%; padding: 15px; background: #111; border: 2px solid #444; color: #00ff00; font-size: 1.1rem; outline: none; box-sizing: border-box; }
        input:focus { border-color: #ff0000; }
        #result { margin-top: 20px; padding: 15px; background: #0f0f0f; border: 1px solid #333; display: none; border-left: 4px solid #00ff00; }
        .advice-box { background: #1a0000; border: 1px dashed #ff0000; padding: 10px; margin-top: 10px; color: #ff9999; font-size: 0.9rem; }
        .red-alert { color: #ff0000; border: 1px solid #ff0000; padding: 10px; margin-top: 20px; text-align: center; font-size: 0.8rem; }
        .footer-lines { margin-top: 30px; font-size: 0.65rem; color: #444; border-top: 1px solid #222; padding-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="bunker-header">
    <div class="status">SYSTEM ACTIVE // 6000 MILES AHEAD</div>
    <h1 style="margin:0; font-size: 1.5rem;">AiNiTA CORE</h1>
</div>

<input type="text" id="search" placeholder="UKUCAJ: VRT, ŠIZ, PAR, BRO..." onkeyup="searchEngine()">

<div id="result"></div>

<div class="red-alert">
    ALARM: PRITISAK > 180/110 | SATURACIJA < 90%
</div>

<div class="footer-lines">
    "ZAPAMTI OVO, ZABORAVI SVE / NE SKLANJAM SE, ZAOBIĐI ME"
</div>

<script src="anitia_data.js"></script>
<script>
    function searchEngine() {
        let query = document.getElementById('search').value.toLowerCase();
        let res = document.getElementById('result');
        
        if (query.length < 2) { res.style.display = 'none'; return; }

        // Objedinjena pretraga kroz sve kategorije u anitia_data.js
        let allData = [...ANITIA_BASE.bolesti, ...ANITIA_BASE.vitalni_parametri, ...ANITIA_BASE.lekovi_info];
        let match = allData.find(item => item.naziv.toLowerCase().includes(query));

        if (match) {
            res.style.display = 'block';
            res.innerHTML = `
                <h2 style="color:#00ff00; margin-top:0;">${match.naziv}</h2>
                <p style="font-size:0.9rem;"><strong>ANALIZA:</strong> ${match.opis}</p>
                ${match.savet ? `<div class="advice-box"><strong>STRATEGIJA:</strong><br>${match.savet}</div>` : ''}
            `;
        } else {
            res.style.display = 'none';
        }
    }
</script>

</body>
    </html>
