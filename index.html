<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AiNiTA 6000 | CORE</title>
    <style>
        body { background: #000; color: #aaa; font-family: 'Courier New', monospace; padding: 15px; margin: 0; }
        .header { border-left: 5px solid #f00; padding: 15px; margin-bottom: 20px; background: rgba(255,0,0,0.05); }
        input { width: 100%; padding: 20px; background: #0a0a0a; border: 1px solid #333; color: #0f0; font-size: 1.3rem; outline: none; border-bottom: 3px solid #f00; box-sizing: border-box; }
        #results { margin-top: 20px; }
        .card { background: #050505; border: 1px solid #1a1a1a; padding: 15px; margin-bottom: 10px; border-left: 4px solid #0f0; cursor: pointer; }
        .tag { color: #f00; font-size: 0.65rem; font-weight: bold; text-transform: uppercase; }
        h2 { color: #fff; margin: 5px 0; font-size: 1.2rem; }
        .details { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid #222; font-size: 0.9rem; line-height: 1.4; }
        .prot { background: rgba(255,0,0,0.1); border: 1px dashed #400; padding: 10px; margin-top: 10px; color: #ff9d9d; }
        .cat-bar { margin-bottom: 15px; display: flex; gap: 5px; overflow-x: auto; }
        .cat-btn { background: #111; border: 1px solid #333; color: #777; padding: 8px 12px; font-size: 0.7rem; }
    </style>
</head>
<body>
<div class="header">
    <div style="color: #0f0; font-size: 0.7rem;">● SYSTEM ACTIVE // ARCHITECT 6000</div>
    <h1 style="color:#fff; margin:5px 0; font-size: 1.4rem;">AiNiTA UNIVERZITET</h1>
</div>
<div class="cat-bar">
    <button class="cat-btn" onclick="filterCat('HITNO')">HITNO</button>
    <button class="cat-btn" onclick="filterCat('LEKOVI')">LEKOVI</button>
    <button class="cat-btn" onclick="filterCat('PSIHO')">PSIHO</button>
</div>
<input type="text" id="search" placeholder="TRAŽI..." oninput="run()">
<div id="results"></div>

<script>
const KORPUS = [
    { 
        n: "Visok Pritisak", c: "HITNO", 
        o: "Stanje iznad 180/110 mmHg. Mozak i srce su pod direktnim udarom.", 
        u: "Pacijenta odmah uspraviti u polusedeći položaj (da se smanji pritisak u glavi). Obezbediti potpunu tišinu. Meriti pritisak na svakih 15 min i zapisivati.", 
        s: "Za suprugu: Tvoj miran glas je ovde 50% leka. Ako on vidi da si ti u panici, pritisak mu neće pasti." 
    },
    { 
        n: "Madopar", c: "LEKOVI", 
        o: "Lek za Parkinsonovu bolest koji nadoknađuje dopamin u mozgu.", 
        u: "Mora se dati tačno u minut. Proteini (meso, mleko) blokiraju njegovu apsorpciju, pa se daje 30 min pre ili 60 min posle jela.", 
        s: "Za suprugu: Ako zakasniš sa dozom, pacijent može da se 'zamrzne' i postane potpuno nepokretan." 
    },
    { 
        n: "Hara - Stabilnost", c: "PSIHO", 
        o: "Tehnika korišćenja sopstvene težine (97kg) za kontrolu situacije bez napora.", 
        u: "Ne vuci pacijenta rukama. Spusti svoje težište, savij kolena i koristi snagu kukova.", 
        s: "Za suprugu: Arhitekta koristi biomehaniku, a ne sirovu snagu. Čuvaj svoja leđa koristeći njegovu masu kao polugu." 
    }
];

function run(filter = '') {
    const q = document.getElementById('search').value.toLowerCase();
    const res = document.getElementById('results');
    res.innerHTML = "";
    let filtered = KORPUS;
    if (filter) filtered = KORPUS.filter(i => i.c === filter);
    else if (q.length < 2) return;
    else filtered = KORPUS.filter(i => i.n.toLowerCase().includes(q) || i.o.toLowerCase().includes(q));

    filtered.forEach(m => {
        res.innerHTML += `
            <div class="card" onclick="this.querySelector('.details').style.display = this.querySelector('.details').style.display === 'block' ? 'none' : 'block'">
                <span class="tag">${m.c}</span>
                <h2>${m.n}</h2>
                <div class="details">
                    <p><strong>DETALJNO:</strong> ${m.o}</p>
                    <p style="color:#0f0;"><strong>UPUTSTVO:</strong> ${m.u}</p>
                    <div class="prot"><strong>SAVET ZA SUPRUGU:</strong><br>${m.s}</div>
                </div>
            </div>`;
    });
}
function filterCat(cat) { document.getElementById('search').value = ''; run(cat); }
</script>
</body>
</html>
