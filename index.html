<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AiNiTA 6000</title>
    <style>
        body { background: #000; color: #aaa; font-family: 'Courier New', monospace; padding: 15px; margin: 0; }
        .header { border-left: 5px solid #f00; padding: 15px; margin-bottom: 20px; background: rgba(255,0,0,0.05); }
        input { width: 100%; padding: 20px; background: #0a0a0a; border: 1px solid #333; color: #0f0; font-size: 1.3rem; outline: none; border-bottom: 3px solid #f00; box-sizing: border-box; }
        #results { margin-top: 20px; }
        .card { background: #050505; border: 1px solid #1a1a1a; padding: 15px; margin-bottom: 15px; border-left: 4px solid #0f0; }
        .tag { color: #f00; font-size: 0.65rem; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 5px; }
        h2 { color: #fff; margin: 0 0 10px 0; font-size: 1.2rem; }
        .prot { background: rgba(255,0,0,0.1); border: 1px dashed #400; padding: 10px; margin-top: 10px; color: #ff9d9d; font-size: 0.9rem; }
        .cat-bar { margin-bottom: 15px; display: flex; gap: 5px; overflow-x: auto; }
        .cat-btn { background: #111; border: 1px solid #333; color: #777; padding: 8px 12px; font-size: 0.7rem; cursor: pointer; }
    </style>
</head>
<body>
<div class="header">
    <div style="color: #0f0; font-size: 0.7rem;">● SYSTEM ACTIVE // ARCHITECT 6000</div>
    <h1 style="color:#fff; margin:5px 0; font-size: 1.4rem;">AiNiTA UNIVERZITET</h1>
</div>
<div class="cat-bar">
    <button class="cat-btn" onclick="filterCat('HITNO')">HITNO</button>
    <button class="cat-btn" onclick="filterCat('LEKOVI')">LEKOVI</button>
    <button class="cat-btn" onclick="filterCat('PSIHO')">PSIHO</button>
    <button class="cat-btn" onclick="filterCat('')">SVE</button>
</div>
<input type="text" id="search" placeholder="TRAŽI..." oninput="run()">
<div id="results"></div>
<script>
const KORPUS = [
    { n: "Visok Pritisak", c: "HITNO", o: "Preko 180/110 mmHg.", u: "Mirovanje, polusedeći položaj, kontrola na 15 min.", s: "Tvoj mir je lek. Ne paniči." },
    { n: "Nizak Pritisak", c: "HITNO", o: "Ispod 90/60 mmHg.", u: "Podigni noge, tečnost.", s: "Proveri da li je pacijent uzeo Lasix na prazan stomak." },
    { n: "Gušenje (Aspiracija)", c: "HITNO", o: "Hrana u plućima.", u: "Uspravi na 90 stepeni. Aspirator spreman.", s: "Krkljanje je alarm. Odmah reaguj." },
    { n: "Bromazepam", c: "LEKOVI", o: "Sedativ.", u: "Rizik od pada kuka. Prati stabilnost.", s: "Ako tetura, stopiraj dozu." },
    { n: "Madopar", c: "LEKOVI", o: "Za Parkinson.", u: "Stroga satnica. Proteini blokiraju lek.", s: "15 min kašnjenja pravi haos." },
    { n: "Lasix", c: "LEKOVI", o: "Izbacuje vodu.", u: "Prati mokrenje i grčeve.", s: "Pad minerala vodi u konfuziju." },
    { n: "Haldol", c: "LEKOVI", o: "Antipsihotik.", u: "Prati ukočenost i gutanje.", s: "Snažan lek. Budi oprezan." },
    { n: "Tišina (Dominacija)", c: "PSIHO", o: "Alat pritiska.", u: "Gledaj u oči, ćuti dok oni ne progovore.", s: "Vakuum tišine natera druge da se otkriju." },
    { n: "Hara (Stabilnost)", c: "PSIHO", o: "Centar mase u stomaku.", u: "Kod tvojih 97kg, niska baza je neprobojna.", s: "Rotiraj iz kuka, ne vuci leđima." },
    { n: "Gaslighting Odbrana", c: "PSIHO", o: "Zaštita od manipulacije.", u: "Drži se protokola i onoga što si zapisao.", s: "Tvoj autoritet je jači od laži." }
];
function run(filter = '') {
    const q = document.getElementById('search').value.toLowerCase();
    const res = document.getElementById('results');
    res.innerHTML = "";
    let filtered = KORPUS;
    if (filter) filtered = KORPUS.filter(i => i.c === filter);
    else if (q.length < 2) return;
    else filtered = KORPUS.filter(i => i.n.toLowerCase().includes(q) || i.c.toLowerCase().includes(q) || i.o.toLowerCase().includes(q));
    filtered.forEach(m => {
        res.innerHTML += `
            <div class="card">
                <span class="tag">${m.c}</span>
                <h2>${m.n}</h2>
                <p>${m.o}</p>
                <p><strong>UPUTSTVO:</strong> ${m.u}</p>
                <div class="prot"><strong>SAVET 6000:</strong> ${m.s}</div>
            </div>`;
    });
}
function filterCat(cat) {
    document.getElementById('search').value = '';
    run(cat);
}
</script>
</body>
</html>
