<style>
body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
.header { background: #1a4a8e; color: white; text-align: center; padding: 20px; }
.container { max-width: 500px; margin: 20px auto; padding: 15px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
#log-area { height: 300px; border: 1px solid #ddd; overflow-y: auto; padding: 10px; margin-bottom: 20px; font-size: 0.85em; background: #fff; text-align: left; }
.log-entry { padding: 8px; border-bottom: 1px solid #eee; line-height: 1.4; }
.log-entry.alert { background: #ffebee; color: #c62828; font-weight: bold; border-left: 5px solid #c62828; }
input, button, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
.btn-main { background: #1a4a8e; color: white; font-weight: bold; border: none; }
.btn-viber { background: #7360f2; color: white; font-weight: bold; border: none; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn-emergency { background: #e53935; color: white; font-weight: bold; border: none; margin-top: 10px; }
.btn-clear { background: #333; color: white; font-size: 12px; opacity: 0.5; border: none; margin-top: 40px; }
#the-alert { display: none; padding: 15px; background: #fff3e0; border: 2px solid #ff9800; margin-bottom: 10px; text-align: left; line-height: 1.5; }
#the-alert b { color: #e65100; }
.tab-nav { display: flex; margin-bottom: 15px; }
.tab-nav button { width: 50%; margin: 0; border-radius: 0; background: #ddd; color: #333; border: none; }
.tab-nav button.active { background: #1a4a8e; color: white; }
.tab { display: none; }
.tab.active { display: block; }
.kartica { border: 1px solid #ddd; padding: 10px; margin: 8px 0; border-radius: 8px; background: #fafafa; }
.kartica b { color: #1a4a8e; }
label { font-size: 12px; font-weight: bold; color: #555; margin-top: 10px; display: block; }
.checkbox-wrap { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
.checkbox-wrap input { width: auto; }
.dev-notice { background: #ffeb3b; padding: 10px; text-align: center; font-weight: bold; }
</style>
</head>
