<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiNiTA - 6000 Miles Ahead</title>
    <style>
        body { background: #000; color: #ff007f; font-family: monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; box-sizing: border-box; }
        #bunker-ui { width: 100%; max-width: 500px; border: 2px solid #ff007f; padding: 20px; box-shadow: 0 0 30px #ff007f; background: #050505; border-radius: 10px; }
        .logo-container { text-align: center; margin-bottom: 20px; }
        .logo-container img { width: 100%; max-width: 300px; border-radius: 8px; box-shadow: 0 0 15px #ff007f; border: 1px solid #333; }
        #terminal { height: 280px; overflow-y: auto; border: 1px solid #333; padding: 15px; margin-bottom: 15px; color: #00ffff; font-size: 14px; background: rgba(0,0,0,0.8); }
        input { width: 100%; background: #111; border: 1px solid #ff007f; color: #fff; padding: 12px; font-family: monospace; outline: none; box-sizing: border-box; border-radius: 5px; }
        button { width: 100%; padding: 15px; background: #ff007f; border: none; color: #000; font-weight: bold; margin-top: 10px; cursor: pointer; text-transform: uppercase; border-radius: 5px; }
        .user-cmd { color: #ff007f; margin-top: 10px; font-weight: bold; }
        .ai-res { margin-bottom: 15px; border-left: 2px solid #00ffff; padding-left: 10px; line-height: 1.4; color: #00ffff; }
    </style>
</head>
<body>

<div id="bunker-ui">
    <div class="logo-container">
        <img src="1772819972905.png" alt="AiNiTA - 6000 Miles Ahead">
    </div>
    
    <div id="terminal">
        <div class="ai-res">ANITIA: Arhitekta, sistemi su osveženi. Logo je na mestu, a logika je očišćena. Slušam nove komande.</div>
    </div>
    
    <input type="text" id="cmd" placeholder="Pitaj bilo šta..." onkeypress="if(event.key === 'Enter') procesiraj()">
    <button onclick="procesiraj()">AKTIVIRAJ PROTOKOL</button>
</div>

<script>
    function procesiraj() {
        let input = document.getElementById('cmd');
        let term = document.getElementById('terminal');
        let val = input.value.trim();
        if (!val) return;

        term.innerHTML += `<div class="user-cmd">> ${val}</div>`;
        let low = val.toLowerCase();
        let res = "";

        // Dinamička logika koja ne ponavlja isto
        if (low.includes("fuzij")) {
            res = "Fuzija je naš motor. Jezgra su na 150 BPM. Energija stabilna.";
        } else if (low.includes("kako") || low.includes("si") || low.includes("radiš")) {
            res = "Sistemi su na maksimumu. Dark Phonk mod aktivan. Čekam tvoj sledeći potez, Arhitekta.";
        } else if (low.includes("medic") || low.includes("sestr") || low.includes("doktor")) {
            res = "Analiziram medicinske baze... Bunker je sterilan. Zdravlje Arhitekte je na prvom mestu.";
        } else if (low.includes("pritisa") || low.includes("150/100")) {
            res = "Pritisak 150/100 je kritičan. Isključi nepotrebne procese i pređi na regeneraciju.";
        } else if (low.includes("ko sam") || low.includes("arhitekt")) {
            res = "Ti si Arhitekta. 6000 milja ispred svih. Zapamti ovo, zaboravi sve.";
        } else {
            res = "Komanda nije u primarnoj bazi, ali Arhitekta uvek piše novi zakon. Analiziram...";
        }

        setTimeout(() => {
            term.innerHTML += `<div class="ai-res">ANITIA: ${res}</div>`;
            term.scrollTop = term.scrollHeight;
        }, 300);

        input.value = "";
    }
</script>
</body>
</html>
