<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AiNiTA | CORE 6000</title>
    <style>
        body { background: #000 !important; color: #0f0 !important; font-family: 'Courier New', monospace; padding: 15px; margin: 0; }
        .header { border-left: 5px solid #f00; padding: 20px; margin-bottom: 20px; background: rgba(255,0,0,0.1); }
        input { width: 100%; padding: 22px; background: #080808; border: 1px solid #333; color: #0f0; font-size: 1.4rem; outline: none; border-bottom: 3px solid #f00; box-sizing: border-box; }
        #results { margin-top: 25px; }
        .card { background: #0a0a0a; border: 1px solid #222; padding: 20px; margin-bottom: 20px; border-left: 6px solid #0f0; }
        .tag { color: #f00; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; display: block; }
        .protocol { background: rgba(255,0,0,0.1); border: 1px dashed #f00; padding: 15px; margin-top: 15px; color: #ff9d9d; }
        h2 { color: #fff; margin: 0 0 10px 0; font-size: 1.5rem; }
    </style>
</head>
<body>

<div class="header">
    <div style="color: #0f0; font-size: 0.75rem; letter-spacing: 2px;">SYSTEM ONLINE // ARCHITECT MODE</div>
    <h1 style="color:#fff; margin:5px 0;">AiNiTA UNIVERZITET</h1>
</div>

<input type="text" id="search" placeholder="TRAŽI (PRITISAK, MADOPAR, PSIHO)..." oninput="run()">

<div id="results"></div>

<script>
const KORPUS = [
    { n: "Visok Krvni Pritisak", c: "HITNO", o: "Iznad 180/110 mmHg. Opasnost od udara.", u: "Mirovanje, polusedeći položaj, merenje na 15 min.", s: "Tvoj mir sprečava skok adrenalina kod pacijenta." },
    { n: "Bromazepam", c: "FARMAKOLOGIJA", o: "Sedativ. Smiruje, ali opušta mišiće.", u: "Rizik od pada kod starijih. Prati stabilnost.", s: "Ne daj ako je pacijent već previše pospan." },
    { n: "Mračna Psihologija - Tišina", c: "STRATEGIJA", o: "Tišina kao alat pritiska na sagovornika.", u: "Gledaj u oči, ćuti dok oni ne progovore.", s: "Ko prvi progovori nakon tišine, gubi dominaciju." },
    { n: "Madopar", c: "FARMAKOLOGIJA", o: "Za Parkinson. Ključan za pokret.", u: "Stroga satnica. Proteini blokiraju lek.", s: "15 min kašnjenja pravi haos. Budi hirurški precizan." },
    { n: "Aikido - Hara", c: "BIOMEHANIKA", o: "Stabilnost iz donjeg dela stomaka.", u: "Tvojih 97kg je neprobojno u niskom stavu.", s: "Rotiraj iz kuka, ne vuci rukama. Čuvaj leđa." },
    { n: "Aspiraciona Pneumonija", c: "NEGA", o: "Gušenje hranom/tečnošću.", u: "Uspravi na 90 stepeni tokom i posle jela.", s: "Krkljanje je alarm. Odmah uspravi korisnika." },
    { n: "Lasix", c: "FARMAKOLOGIJA", o: "Izbacuje vodu, obara pritisak.", u: "Prati mokrenje i grčeve (pad kalijuma).", s: "Previše Lasixa vodi u konfuziju i padove." },
    { n: "Gaslighting", c: "ODBRANA", o: "Manipulacija kolega tvojom percepcijom.", u: "Drži se protokola i zapisanih činjenica.", s: "Tvoj mirni autoritet je neprobojan štit." }
];

function run() {
    const q = document.getElementById('search').value.toLowerCase();
    const res = document.getElementById('results');
    res.innerHTML = "";
    if(q.length < 2) return;

    KORPUS.filter(i => i.n.toLowerCase().includes(q) || i.c.toLowerCase().includes(q) || i.o.toLowerCase().includes(q))
    .forEach(m => {
        res.innerHTML += `
            <div class="card">
                <span class="tag">${m.c}</span>
                <h2>${m.n}</h2>
                <p><strong>OPIS:</strong> ${m.o}</p>
                <p style="color:#0f0;"><strong>UPUTSTVO:</strong> ${m.u}</p>
                <div class="protocol"><strong>SAVET 6000:</strong><br>${m.s}</div>
            </div>`;
    });
}
</script>
</body>
</html>
