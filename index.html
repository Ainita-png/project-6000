<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiNiTA | Arhitekta 6000</title>
    <style>
        body { background: #050505; color: #d0d0d0; font-family: 'Courier New', monospace; padding: 20px; text-transform: uppercase; }
        .bunker-header { border-bottom: 3px solid #ff0000; padding-bottom: 15px; margin-bottom: 25px; }
        .status { color: #00ff00; font-size: 0.8rem; letter-spacing: 2px; }
        input { width: 100%; padding: 18px; background: #111; border: 2px solid #333; color: #ff0000; font-size: 1.3rem; outline: none; box-sizing: border-box; }
        input:focus { border-color: #ff0000; box-shadow: 0 0 10px #ff0000; }
        #result { margin-top: 25px; padding: 20px; background: #0f0f0f; border: 1px solid #222; display: none; }
        .advice-box { background: #1a0000; border: 1px dashed #ff0000; padding: 15px; margin-top: 15px; color: #ff9999; }
        .red-alert { color: #ff0000; border: 2px solid #ff0000; padding: 15px; margin-top: 30px; text-align: center; animation: blink 1s infinite; }
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.3;} 100% {opacity: 1;} }
        .footer-lines { margin-top: 40px; font-size: 0.7rem; color: #444; border-top: 1px solid #222; padding-top: 10px; }
    </style>
</head>
<body>

<div class="bunker-header">
    <h1>AiNiTA CORE</h1>
    <div class="status">SYSTEM ACTIVE // 6000 MILES AHEAD</div>
</div>

<input type="text" id="search" placeholder="UNESI SIMPTOM ILI TERMIN..." onkeyup="searchEngine()">

<div id="result"></div>

<div class="red-alert">
    CRVENI ALARM: PRITISAK > 180/110 | SAT < 90%
</div>

<div class="footer-lines">
    "Zapamti ovo, zaboravi sve / Ne sklanjam se, zaobiđi me"
</div>

<script src="anitia_data.js"></script>
<script>
    function searchEngine() {
        let query = document.getElementById('search').value.toLowerCase();
        let res = document.getElementById('result');
        
        if (query.length < 2) { res.style.display = 'none'; return; }

        let match = ANITIA_BASE.bolesti.find(b => b.naziv.toLowerCase().includes(query)) || 
                    ANITIA_BASE.vitalni_parametri.find(v => v.naziv.toLowerCase().includes(query));

        if (match) {
            res.style.display = 'block';
            res.innerHTML = `
                <h2 style="color:#00ff00">${match.naziv}</h2>
                <p><strong>ANALIZA:</strong> ${match.opis}</p>
                ${match.savet ? `<div class="advice-box"><strong>PSIHOLOŠKI BLUEPRINT:</strong><br>${match.savet}</div>` : ''}
            `;
        } else {
            res.style.display = 'none';
        }
    }
</script>

</body>
    </html>
