<!DOCTYPE html>
<html lang="sr">
<head>

    <title>PRIRUČNIK ZA NEGAVATELJE</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 0; }

        .log-entry { padding: 8px; border-bottom: 1px solid #eee; }
        .log-entry.alert { background: #ffebee; color: #c62828; font-weight: bold; border-left: 5px solid #c62828; }
        select, input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .btn-main { background: #1a4a8e; color: white; font-weight: bold; cursor: pointer; border: none; }
        .btn-emergency { background: #e53935; color: white; font-weight: bold; cursor: pointer; border: none; margin-top: 10px; }
        #the-alert { display: none; padding: 15px; background: #fff3e0; border: 2px solid #ff9800; margin-bottom: 10px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

</div>

    <input type="text" id="patient-input" placeholder="Simptom (mučnina, pritisak, bol)...">

    <button class="btn-main" onclick="izvršiProtokol()">EVIDENTIRAJ PROMENU</button>
    <button class="btn-emergency" onclick="registrujHitnu()">🚑 HITNA POMOĆ</button>
</div>

    firebase.initializeApp(firebaseConfig);

    };

    // 4. Čitanje u realnom vremenu
    logsRef.on('value', (snapshot) => {
        const data = snapshot.val();
        const logArea = document.getElementById('log-area');
        logArea.innerHTML = "";
        if (data) {
            Object.values(data).reverse().forEach(log => {
                const div = document.createElement('div');
                div.className = log.hitno ? 'log-entry alert' : 'log-entry';
                div.innerHTML = `<strong>[${log.vreme}] ${log.ko}:</strong> ${log.tekst}`;
                logArea.appendChild(div);
            });
        } else {
            logArea.innerHTML = "Dnevnik je prazan.";
        }
    });

    // Zapis u Firebase
    logsRef.push({
        vreme: new Date().toLocaleTimeString('sr-RS'),
        ko: ko.toUpperCase(),
        tekst: unosRaw.toUpperCase() + " -> " + instrukcija,

    });

    });

    document.getElementById('patient-input').value = "";

    };

    window.registrujHitnu = function() {
        const ko = document.getElementById('nurse-name').value || "NEPOZNATO";

</script>

</body>
</html>
